name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-path: ${{ github.workspace }}/.m2/repository

      - name: Verify
        run: ./mvnw -B verify -Dquarkus.container-image.build=false --no-transfer-progress -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2/repository"

      - name: Check release verifier
        run: python3 scripts/test_release_artifacts.py

      - name: Produce and check application Releases
        run: |
          ./mvnw -B -pl indexer,query org.pipelineframework:pipelineframework-release-maven-plugin:generate-release-descriptor@produce-application-release org.codehaus.mojo:build-helper-maven-plugin:attach-artifact@attach-release-application-archive -Dtpf.release.skip=false -Dtpf.release.version="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -Dtpf.release.allowLocalUris=true --no-transfer-progress -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2/repository"
          python3 scripts/check-release-artifacts.py indexer query
